[project]
name = "discord-clyde"
version = "1.1.0"
description = "Build rich Discord Webhook API interactions with a typed Python API."
readme = "README.md"
authors = [
    { name = "Ethan C", email = "16727756+EthanC@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.21.1",
    "niquests>=3.21.1",
]
license = "AGPL-3.0"
license-files = ["LICENSE"]
keywords = ["discord", "webhook", "rest", "api", "library", "wrapper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/EthanC/Clyde"
Issues = "https://github.com/EthanC/Clyde/issues"
Changelog = "https://github.com/EthanC/Clyde/releases"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "environs>=15.2.0",
    "ty>=0.0.78",
    "zensical>=0.0.59",
    "mkdocstrings-python>=2.0.8",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I", "D"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest]
strict_xfail = true
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
branch = true
source = ["clyde"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["clyde"]

[tool.tox]
requires = ["tox>=4.61.2", "tox-uv>=1.36.0"]
env_list = [
    "3.14",
    "3.13",
    "3.12",
    "3.11",
]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
dependency_groups = ["dev"]
commands = [["pytest"]]
allowlist_externals = ["pytest"]
set_env = { TESTS_WEBHOOK_URL = "{env:TESTS_WEBHOOK_URL}" }
